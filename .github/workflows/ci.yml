name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://recursos_ci:recursos_ci@127.0.0.1:5432/recursos_ci
      JWT_SECRET_KEY: chave-ficticia-exclusiva-para-ci
      JWT_ALGORITHM: HS256
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local-only-elasticmq
      AWS_SECRET_ACCESS_KEY: local-only-elasticmq
      SQS_ENDPOINT_URL: http://127.0.0.1:9324
      SQS_RECURSOS_TO_ORDENS_URL: http://127.0.0.1:9324/000000000000/mvp-oficina-recursos-to-ordens-local.fifo
      SQS_ORDENS_TO_RECURSOS_URL: http://127.0.0.1:9324/000000000000/mvp-oficina-ordens-to-recursos-local.fifo
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recursos_ci
          POSTGRES_USER: recursos_ci
          POSTGRES_PASSWORD: recursos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recursos_ci -d recursos_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:9324/?Action=ListQueues"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Initialize reports directory
        run: mkdir -p reports
      - name: Health check and initialize queues
        run: python .github/scripts/bootstrap_ci_services.py
      - name: Ruff
        run: python -m ruff check src tests .github/scripts
      - name: Pytest with combined coverage gate
        run: >-
          python -m pytest
          --cov=src/app
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit.xml
      - name: Generate quality reports
        run: |
          python -m radon cc src/app --json > reports/radon-complexity.json
          python -m radon mi src/app --json > reports/radon-maintainability.json
      - name: Complexity quality gate
        run: |
          python -m xenon --max-absolute C --max-modules C --max-average B src/app 2>&1 | tee reports/xenon-gate.txt
          echo "PASS: absolute<=C modules<=C average<=B" >> reports/xenon-gate.txt
      - name: Build test image
        run: docker build --target test -t mvp-oficina-recursos:test-${{ github.sha }} .
      - name: Build runtime image
        run: docker build --target runtime -t mvp-oficina-recursos:runtime-${{ github.sha }} .
      - name: Publish test, coverage and quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recursos-ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup CI service containers
        if: always()
        run: |
          docker ps --all --quiet --filter ancestor=postgres:16-alpine | xargs --no-run-if-empty docker rm --force
          docker ps --all --quiet --filter ancestor=softwaremill/elasticmq-native:1.7.1 | xargs --no-run-if-empty docker rm --force
